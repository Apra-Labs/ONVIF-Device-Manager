name: ODM

on:
  pull_request:
    branches: [ "development" ]
  push:
    branches: [ "development" ]
    tags: ['v*']

jobs:

  build:

    environment: signing
    runs-on: windows-2022

    permissions:
      id-token: write
      contents: write

    env:
      Solution_Name: odm.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup VS Dev Environment
      uses: seanmiddleditch/gha-setup-vsdevenv@v4

    - name: Install .NET Framework targeting packs
      shell: pwsh
      run: |
        # Install .NET 4.0 and 4.5 reference assemblies via NuGet packages
        $nuget = "nuget"
        $outDir = "$env:TEMP\netfx-ref"
        & $nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -OutputDirectory $outDir -ExcludeVersion -NonInteractive
        & $nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -OutputDirectory $outDir -ExcludeVersion -NonInteractive

        $refRoot = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework"

        # Copy .NET 4.0 reference assemblies
        $src40 = "$outDir\Microsoft.NETFramework.ReferenceAssemblies.net40\build\.NETFramework\v4.0"
        $dst40 = "$refRoot\v4.0"
        if (-not (Test-Path $dst40)) { New-Item -ItemType Directory -Path $dst40 | Out-Null }
        Copy-Item "$src40\*" $dst40 -Recurse -Force

        # Copy .NET 4.5 reference assemblies
        $src45 = "$outDir\Microsoft.NETFramework.ReferenceAssemblies.net45\build\.NETFramework\v4.5"
        $dst45 = "$refRoot\v4.5"
        if (-not (Test-Path $dst45)) { New-Item -ItemType Directory -Path $dst45 | Out-Null }
        Copy-Item "$src45\*" $dst45 -Recurse -Force

        Write-Host "Targeting packs installed."

    - name: Set build version
      shell: pwsh
      run: |
        $hash = (git rev-parse --short HEAD).Trim()
        $ref  = "${{ github.ref }}"
        if ($ref -match '^refs/tags/v(.+)$') {
          $tagVer  = $Matches[1]
          $ver4    = "$tagVer.0"
          $verMsi  = $tagVer
          $verInfo = "$tagVer+$hash"
        } else {
          $run     = "${{ github.run_number }}"
          $ver4    = "3.0.$run.0"
          $verMsi  = "3.0.$run"
          $verInfo = "3.0.$run+$hash"
        }

        $csFiles = @(
          "odm\~cfg\AssemblyInfo.global.cs",
          "onvif\~cfg\AssemblyInfo.global.cs",
          "utils\~cfg\AssemblyInfo.global.cs"
        )
        foreach ($f in $csFiles) {
          if (Test-Path $f) {
            $c = Get-Content $f -Raw
            $c = $c -replace 'AssemblyVersion\("[^"]*"\)',              "AssemblyVersion(`"$ver4`")"
            $c = $c -replace 'AssemblyFileVersion\("[^"]*"\)',          "AssemblyFileVersion(`"$ver4`")"
            $c = $c -replace 'AssemblyInformationalVersion\("[^"]*"\)', "AssemblyInformationalVersion(`"$verInfo`")"
            Set-Content $f $c -NoNewline
          }
        }

        $fsFiles = @(
          "odm\~cfg\AssemblyInfo.global.fs",
          "onvif\~cfg\AssemblyInfo.global.fs",
          "utils\~cfg\AssemblyInfo.global.fs"
        )
        foreach ($f in $fsFiles) {
          if (Test-Path $f) {
            $c = Get-Content $f -Raw
            $c = $c -replace 'AssemblyVersion\("[^"]*"\)',     "AssemblyVersion(`"$ver4`")"
            $c = $c -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$ver4`")"
            Set-Content $f $c -NoNewline
          }
        }

        $vdproj  = "odm.setup\odm.setup.vdproj"
        $newGuid = [guid]::NewGuid().ToString().ToUpper()
        $c = Get-Content $vdproj -Raw
        $c = $c -replace '"ProductCode" = "8:\{[0-9A-Fa-f-]+\}"', ('"ProductCode" = "8:{' + $newGuid + '}"')
        $c = $c -replace '"ProductVersion" = "8:[0-9.]+"',         ('"ProductVersion" = "8:' + $verMsi + '"')
        Set-Content $vdproj $c -NoNewline

        Write-Host "Version: $verInfo   MSI: $verMsi   ProductCode: {$newGuid}"

    - name: Restore odm.onvif.gen
      run: dotnet restore onvif\odm.onvif.gen\odm.onvif.gen.csproj

    - name: Build application
      run: msbuild ${{ env.Solution_Name }} /p:Configuration=Release /p:Platform=x64 /p:DeployExtension=false /m /nologo /v:minimal

    - name: Restore tests
      run: dotnet restore odm\odm.tests\odm.tests.csproj

    - name: Build tests
      run: msbuild odm\odm.tests\odm.tests.csproj /p:Configuration=Debug /p:Platform="Any CPU" /v:minimal

    - name: Run tests
      run: |
        $vstest = "${{ env.DevEnvDir }}CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
        & $vstest "odm\odm.tests\bin\Any CPU\Debug\net48\odm.tests.dll" /logger:trx
      shell: pwsh

    - name: Collect artifacts
      run: .\package.bat
      shell: cmd

    - name: Verify required DLLs present
      shell: pwsh
      run: |
        $required = @(
          "build\odm.exe",
          "build\odm.player.net.dll",
          "build\odm.player.host.exe",
          "build\odm.player.media.dll",
          "build\avcodec-61.dll",
          "build\avformat-61.dll",
          "build\avutil-59.dll",
          "build\swscale-8.dll",
          "build\swresample-5.dll"
        )
        $missing = $required | Where-Object { -not (Test-Path $_) }
        if ($missing) {
          Write-Error "Missing required artifacts:`n$($missing -join "`n")"
          exit 1
        }
        Write-Host "All required DLLs present."

    - name: Strip PDB files from installer inputs
      shell: pwsh
      run: |
        $removed = 0
        Get-ChildItem -Recurse -Filter "*.pdb" "odm\odm.ui.app\bin\x64\Release" -ErrorAction SilentlyContinue |
          ForEach-Object { Remove-Item $_.FullName -Force; $removed++ }
        Get-ChildItem -Recurse -Filter "*.pdb" "build" -ErrorAction SilentlyContinue |
          ForEach-Object { Remove-Item $_.FullName -Force; $removed++ }
        Write-Host "Removed $removed PDB file(s) from installer inputs."

    - name: DisableOutOfProcBuild
      working-directory: ${{env.DevEnvDir}}\CommonExtensions\Microsoft\VSI\DisableOutOfProcBuild
      run: .\DisableOutOfProcBuild.exe
      continue-on-error: true

    - name: Build installer
      run: devenv ${{ env.Solution_Name }} /Build "Release|x64" /Project odm.setup
      shell: cmd

    - name: Azure Login (OIDC)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Sign exe
      if: startsWith(github.ref, 'refs/tags/v')
      uses: azure/trusted-signing-action@v0
      with:
        endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
        files-folder: build
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Sign MSI
      if: startsWith(github.ref, 'refs/tags/v')
      uses: azure/trusted-signing-action@v0
      with:
        endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
        files-folder: odm.setup/Release
        files-folder-filter: msi
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: odm-build-zip
        path: build/

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: odm-installer
        path: odm.setup/Release/odm.setup.msi

    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          odm.setup/Release/odm.setup.msi


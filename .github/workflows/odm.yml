name: ODM

on:
  pull_request:
    branches: [ "development" ]

jobs:

  build:

    runs-on: windows-2022

    env:
      Solution_Name: odm.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup VS Dev Environment
      uses: seanmiddleditch/gha-setup-vsdevenv@v4

    - name: Install .NET Framework targeting packs
      shell: pwsh
      run: |
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        & $installer modify `
          --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
          --add Microsoft.Net.Component.4.TargetingPack `
          --add Microsoft.Net.Component.4.5.2.TargetingPack `
          --quiet --norestart
        exit 0

    - name: Build application
      run: devenv ${{ env.Solution_Name }} /Build "Release|x64" /Project odm.ui.app

    - name: Build tests
      run: msbuild odm\odm.tests\odm.tests.csproj /p:Configuration=Debug /p:Platform="Any CPU" /v:minimal

    - name: Run tests
      run: |
        $vstest = "${{ env.DevEnvDir }}CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
        & $vstest "odm\odm.tests\bin\Debug\net48\odm.tests.dll" /logger:trx
      shell: pwsh

    - name: Collect artifacts
      run: .\package.bat
      shell: cmd

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: odm-build-zip
        path: build/

    - name: DisableOutOfProcBuild
      working-directory: ${{env.DevEnvDir}}\CommonExtensions\Microsoft\VSI\DisableOutOfProcBuild
      run: .\DisableOutOfProcBuild.exe
      continue-on-error: true

    - name: Build installer
      run: devenv ${{ env.Solution_Name }} /Build "Release|x64" /Project odm.setup
      shell: cmd

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: odm-installer
        path: odm.setup/Release/odm.setup.msi
